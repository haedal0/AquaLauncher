[workspace]
resolver = "2"
members = [
  "crates/aqua-manifest",
  "src-tauri",
  "cli",
  "fixtures/server",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"
sha1 = "0.10"
reqwest = { version = "0.12", default-features = true, features = ["blocking"] }
tempfile = "3"
