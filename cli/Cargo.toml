[package]
name = "aqua-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aqua-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
aqua-manifest = { path = "../crates/aqua-manifest" }

[dev-dependencies]
tempfile = { workspace = true }
